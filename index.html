<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211a16">
<title>منيو الياسمينا</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#171411}
body{font-family:Arial,sans-serif;overflow:hidden}
#viewer{width:100%;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.page{display:none;width:min(100vw,calc(100dvh * 400 / 844));height:min(100dvh,calc(100vw * 844 / 400));position:relative}
.page.active{display:block}.page img{display:block;width:100%;height:100%;object-fit:fill}
.hotspot{position:absolute;left:8%;width:84%;height:7.4%;display:block;background:transparent;border:0}
#p2 .h1{top:8.4%}#p2 .h2{top:17.4%}#p2 .h3{top:26.4%}#p2 .h4{top:35.4%}#p2 .h5{top:44.4%}#p2 .h6{top:53.4%}#p2 .h7{top:62.4%}#p2 .h8{top:71.4%}#p2 .h9{top:80.4%}
.nav{position:fixed;z-index:10;bottom:max(8px,env(safe-area-inset-bottom));left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none}
.nav button{pointer-events:auto;border:0;border-radius:22px;padding:9px 15px;background:rgba(0,0,0,.65);color:#fff;font-size:14px}
.nav button:disabled{opacity:.25}
@media(min-width:600px){#viewer{background:#0f0d0b}.page{box-shadow:0 0 24px #0008}}
</style></head><body><main id="viewer">
<section class="page active" id="p1"><img src="assets/page-1.jpg" alt="منيو الياسمينا - صفحة 1" loading="eager"></section><section class="page" id="p2"><img src="assets/page-2.jpg" alt="منيو الياسمينا - صفحة 2" loading="eager"></section><section class="page" id="p3"><img src="assets/page-3.jpg" alt="منيو الياسمينا - صفحة 3" loading="lazy"></section><section class="page" id="p4"><img src="assets/page-4.jpg" alt="منيو الياسمينا - صفحة 4" loading="lazy"></section><section class="page" id="p5"><img src="assets/page-5.jpg" alt="منيو الياسمينا - صفحة 5" loading="lazy"></section><section class="page" id="p6"><img src="assets/page-6.jpg" alt="منيو الياسمينا - صفحة 6" loading="lazy"></section><section class="page" id="p7"><img src="assets/page-7.jpg" alt="منيو الياسمينا - صفحة 7" loading="lazy"></section>
</main><div class="nav"><button id="prev">السابق</button><button id="home">الأقسام</button><button id="next">التالي</button></div>
<script>
const pages=[...document.querySelectorAll('.page')];let current=1;
function show(n){current=Math.max(1,Math.min(pages.length,n));pages.forEach((p,i)=>p.classList.toggle('active',i===current-1));document.getElementById('prev').disabled=current===1;document.getElementById('next').disabled=current===pages.length;history.replaceState(null,'','?page='+current)}
function go(n){show(n)}
// Links follow the category pages actually present in the supplied PDF.
const targets=[3,4,5,6,0,0,7,0,0];
targets.forEach((target,i)=>{const a=document.createElement('a');a.className='hotspot h'+(i+1);a.href=target?'?page='+target:'#';a.setAttribute('aria-label','قسم المنيو '+(i+1));a.addEventListener('click',e=>{e.preventDefault();if(target)go(target)});document.getElementById('p2').appendChild(a)});
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('home').onclick=()=>go(2);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(current+1);if(e.key==='ArrowRight')go(current-1)});
const n=parseInt(new URLSearchParams(location.search).get('page')||'1',10);show(Number.isFinite(n)?n:1);
</script></body></html>
