<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211c18">
<title>منيو الياسمينا</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#211c18}body{font-family:Arial,sans-serif;display:flex;justify-content:center}.page{position:relative;width:100%;max-width:700px;line-height:0}.page img{display:block;width:100%;height:auto}.hotspot{position:absolute;display:block;line-height:normal;text-decoration:none;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent}.hotspot:focus-visible{outline:2px solid #fff;outline-offset:2px;border-radius:5px}
/* The category links are placed over the matching labels on page 2. */
/* coordinates are percentages of the source page, so they scale with the menu image */
.shawarma{left:54%;top:37.5%;width:31%;height:4.2%}
.chicken-grills{left:52%;top:41.8%;width:34%;height:4.2%}
.meat-grills{left:52%;top:46.1%;width:34%;height:4.2%}
.crispy{left:54%;top:50.4%;width:29%;height:4.2%}
.casseroles{left:18%;top:38%;width:24%;height:4.2%}
/* Avoid accidental sideways scrolling on phones; preserve the PDF's original page ratio. */
@media(min-width:701px){.page{max-width:500px}}
</style>
</head>
<body>
<main class="page" id="page"></main>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  let n=parseInt(params.get('page')||'1',10);
  if(!Number.isFinite(n)||n<1||n>7)n=1;
  const root=document.getElementById('page');
  const img=document.createElement('img');
  img.src='assets/page-'+n+'.jpg';
  img.alt='منيو مطعم الياسمينا - الصفحة '+n;
  img.width=500; img.height=845;
  img.fetchPriority='high';
  root.appendChild(img);
  if(n===2){
    const links=[
      ['shawarma',3,'شاورما الفراخ'],
      ['chicken-grills',4,'مشويات الفراخ'],
      ['meat-grills',5,'مشويات اللحوم'],
      ['crispy',6,'فراخ كريسبي'],
      ['casseroles',7,'الطواجن']
    ];
    for(const [cls,page,label] of links){
      const a=document.createElement('a');
      a.className='hotspot '+cls;
      a.href='index.html?page='+page;
      a.setAttribute('aria-label',label);
      a.title=label;
      root.appendChild(a);
    }
  }
})();
</script>
</body>
</html>
