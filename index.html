<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#211b13">
<title>منيو الياسمينا</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#17130f;font-family:Arial,Tahoma,sans-serif}
body{display:flex;justify-content:center;align-items:flex-start}
.menu-page{position:relative;width:min(100vw,calc(100vh * 300 / 633));max-width:600px;line-height:0}
.menu-page img{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cover-menu{left:18%;top:53%;width:64%;height:11%}
.category-link{border-radius:8px}
.back{position:fixed;z-index:10;top:max(10px,env(safe-area-inset-top));right:10px;line-height:1.2;text-decoration:none;color:#23190b;background:#ffc928;border:1px solid rgba(255,255,255,.45);border-radius:24px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:0 2px 9px #0005}
.back:active{transform:scale(.98)}
@media(min-width:700px){body{padding:14px 0}.menu-page{width:min(440px,calc(100vh * 300 / 633))}}
</style>
</head>
<body>
<main class="menu-page" id="app" aria-label="منيو مطعم الياسمينا"></main>
<script>
const pageParam = new URLSearchParams(location.search).get('page');
let page = Number(pageParam || 1);
if (!Number.isInteger(page) || page < 1 || page > 13) page = 1;
const app = document.getElementById('app');
const img = document.createElement('img');
img.src = `assets/page${page}.png`;
img.alt = page === 1 ? 'منيو مطعم الياسمينا' : page === 2 ? 'قائمة أصناف المنيو' : 'منيو الياسمينا - صفحة الصنف';
img.fetchPriority = 'high';
app.appendChild(img);
function addLink(href, cls, label, style) {
 const a=document.createElement('a'); a.href=href; a.className='hotspot '+cls; a.setAttribute('aria-label',label); a.title=label;
 Object.assign(a.style,style); app.appendChild(a);
}
if(page===1){
 addLink('?page=2','cover-menu','عرض المنيو',{});
} else if(page===2){
 const categoryLinks = [
  ['?page=3','شاورما الفراخ','6.4771%'],
  ['?page=4','مشويات الفراخ','15.0079%'],
  ['?page=5','مشويات اللحمة','22.5118%'],
  ['?page=6','فراخ كريسبي','30.0158%'],
  ['?page=10','البيتزا','36.3349%'],
  ['?page=9','المناقيش','43.4439%'],
  ['?page=7','الطواجن','50.5529%'],
  ['?page=8','الصفائح','58.4518%'],
  ['?page=13','السندوتشات','66.3507%'],
  ['?page=12','المقبلات','73.8547%'],
  ['?page=11','المشروبات','81.3586%']
 ];
 categoryLinks.forEach(([href,label,top]) => {
  addLink(href,'category-link',label,{top, height:'4.7393%',left:'18%',width:'64%'});
 });
} else {
 const back=document.createElement('a');
 back.href='?page=2'; back.className='back'; back.textContent='‹ الأصناف';
 back.setAttribute('aria-label','الرجوع إلى صفحة الأصناف الرئيسية');
 document.body.appendChild(back);
 // tap the page title area to return to the categories list as an additional shortcut
 addLink('?page=2','','الرجوع إلى الأصناف',{top:'0%',left:'0%',width:'100%',height:'8%'});
}
</script>
</body>
</html>
