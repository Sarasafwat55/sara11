<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080808">
  <title>منيو الياسمينا | AL YASMINA</title>
  <style>
    :root { --gold: #f5c542; --orange: #c76a18; --black: #080808; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px 14px; min-height: 100vh;
      background: var(--black); color: #fff;
      font-family: Tahoma, Arial, sans-serif; text-align: center;
    }
    main { max-width: 1000px; margin: 0 auto; }
    h1 { color: var(--gold); margin: 12px 0 6px; font-size: clamp(28px, 5vw, 46px); }
    .subtitle { color: #ddd; margin: 0 0 24px; }
    .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 20px 0; }
    .btn {
      display: inline-block; padding: 13px 20px; border: 1px solid var(--gold);
      border-radius: 8px; color: #111; background: var(--gold);
      text-decoration: none; font-weight: bold; min-width: 190px;
    }
    .btn.secondary { background: transparent; color: var(--gold); }
    .viewer { width: 100%; height: 78vh; min-height: 480px; border: 1px solid #49351c; border-radius: 8px; background: #fff; }
    .note { color: #bbb; font-size: 13px; margin-top: 16px; }
    @media (max-width: 600px) {
      body { padding: 18px 8px; }
      .btn { width: 100%; }
      .viewer { height: 72vh; min-height: 420px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>منيو الياسمينا</h1>
    <p class="subtitle">AL YASMINA · المأكولات السورية</p>

    <div class="actions">
      <a class="btn" href="./menu.pdf" target="_blank" rel="noopener">مشاهدة المنيو كاملًا</a>
      <a class="btn secondary" href="./menu.pdf" download="Al-Yasmina-Menu.pdf">تحميل المنيو PDF</a>
    </div>

    <iframe class="viewer" src="./menu.pdf" title="منيو مطعم الياسمينا PDF">
      المتصفح لا يدعم عرض PDF. استخدمي زر مشاهدة المنيو.
    </iframe>

    <p class="note">لو المنيو لم يظهر، تأكدي أن ملف PDF موجود في نفس المجلد واسمه menu.pdf.</p>
  </main>
</body>
</html>
