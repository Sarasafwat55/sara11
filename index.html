<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منيو مطعم الياسمينا</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:#201a16;font-family:Arial,sans-serif}
html{-webkit-text-size-adjust:100%;}
body{display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}
.viewer{position:relative;width:100%;max-width:1333px;line-height:0;margin:0 auto}
.page{display:block;width:100%;max-width:100%;height:auto;object-fit:contain}
.hotspot{position:absolute;display:block;z-index:2;background:transparent;border:0;outline:0;cursor:pointer}
.hotspot:focus-visible{outline:3px solid #ffca16;background:#ffffff12}
.nav{position:fixed;z-index:5;bottom:14px;left:14px;display:flex;gap:8px;direction:ltr;line-height:1}
.nav a{font:600 14px Arial,sans-serif;color:#24170b;background:#ffca16;text-decoration:none;padding:11px 14px;border-radius:7px;box-shadow:0 2px 10px #0005}
.nav a:hover{background:#ffe078}
@media(min-width:1334px){.viewer{width:1333px}}
@media(max-width:600px){
  .viewer{width:100vw;max-width:100vw}
  .page{width:100%;height:auto;max-width:100%;}
  .nav{bottom:max(10px,env(safe-area-inset-bottom));left:10px;gap:6px}
  .nav a{font-size:13px;padding:10px 12px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="viewer" id="viewer">
  <img id="pageImage" class="page" src="assets/page-1.jpg" alt="منيو مطعم الياسمينا">
</div>
<nav class="nav" aria-label="Menu navigation">
  <a href="index.html?page=1">الرئيسية</a>
  <a href="index.html?page=2">MENU</a>
</nav>
<script>
const pages = ["page-1.jpg", "page-2.jpg", "page-3.jpg", "page-4.jpg", "page-5.jpg", "page-6.jpg", "page-7.jpg"];
const hotspots = {"1": [{"x": 31, "y": 57, "w": 36, "h": 20, "href": "index.html?page=2", "label": "Open menu"}], "2": [{"x": 57, "y": 5, "w": 38, "h": 14, "href": "index.html?page=3", "label": "شاورما الفراخ"}, {"x": 57, "y": 19, "w": 39, "h": 14, "href": "index.html?page=4", "label": "مشويات الفراخ"}, {"x": 56, "y": 33, "w": 40, "h": 14, "href": "index.html?page=5", "label": "مشويات اللحم"}, {"x": 65, "y": 47, "w": 31, "h": 14, "href": "index.html?page=6", "label": "فراخ كريسبي"}, {"x": 68, "y": 62, "w": 28, "h": 14, "href": "index.html?page=6", "label": "المعجنات"}, {"x": 68, "y": 77, "w": 28, "h": 14, "href": "index.html?page=6", "label": "الصفائح"}, {"x": 5, "y": 5, "w": 37, "h": 14, "href": "index.html?page=7", "label": "الطواجن"}, {"x": 5, "y": 20, "w": 37, "h": 14, "href": "index.html?page=2", "label": "السندوتشات"}, {"x": 5, "y": 39, "w": 37, "h": 14, "href": "index.html?page=2", "label": "المقبلات"}, {"x": 5, "y": 55, "w": 37, "h": 14, "href": "index.html?page=2", "label": "المشروبات"}], "3": [], "4": [], "5": [], "6": [], "7": []};
const params = new URLSearchParams(location.search);
let page = Number(params.get('page') || 1);
if (!Number.isInteger(page) || page < 1 || page > pages.length) page = 1;
const viewer = document.getElementById('viewer');
const img = document.getElementById('pageImage');
img.src = 'assets/' + pages[page-1];
img.alt = 'منيو مطعم الياسمينا - الصفحة ' + page;
for (const spot of (hotspots[page] || [])) {
  const a = document.createElement('a');
  a.className = 'hotspot';
  a.href = spot.href;
  a.setAttribute('aria-label', spot.label);
  a.title = spot.label;
  a.style.left = spot.x + '%';
  a.style.top = spot.y + '%';
  a.style.width = spot.w + '%';
  a.style.height = spot.h + '%';
  viewer.appendChild(a);
}
</script>
</body>
</html>
