<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-label="مشروبات توت">
  <!-- كوباية توت بنفس روح الباكدجنج: أسود + دهبي + لمسة أحمر -->
  <defs>
    <linearGradient id="ice" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFE7A3"/><stop offset="1" stop-color="#FFB800"/></linearGradient>
    <clipPath id="cupClip"><path d="M268 170h184l-22 300a20 20 0 0 1-20 18H310a20 20 0 0 1-20-18z"/></clipPath>
  </defs>
  <!-- splashes -->
  <g fill="#FFB800">
    <circle cx="210" cy="250" r="9"/><circle cx="190" cy="300" r="5"/><circle cx="520" cy="230" r="8"/><circle cx="540" cy="285" r="5"/>
    <path d="M232 200c-18-6-30 4-26 18 10-8 18-10 26-18zM488 196c18-8 32 2 28 16-10-8-18-8-28-16z"/>
  </g>
  <!-- straw -->
  <path d="M392 168 430 52l20 6-36 112" fill="#D12F1F" stroke="#080808" stroke-width="8" stroke-linejoin="round"/>
  <path d="M420 84l14 5M412 110l14 5M404 136l14 5" stroke="#F7F2E8" stroke-width="7" stroke-linecap="round"/>
  <!-- cup body -->
  <g clip-path="url(#cupClip)">
    <rect x="250" y="160" width="220" height="340" fill="#080808"/>
    <rect x="250" y="160" width="220" height="64" fill="url(#ice)"/>
    <g fill="#FFB800">
      <path d="M250 268h220v16H250zM250 300h220v10H250zM250 420h220v10H250zM250 446h220v16H250z"/>
    </g>
    <!-- diamond + crown mark -->
    <path d="M360 326l20 28-20 30-20-30z" fill="#FFB800"/>
    <path d="M332 404l8-18 10 10 10-16 10 16 10-10 8 18z" fill="#F7F2E8"/>
  </g>
  <path d="M268 170h184l-22 300a20 20 0 0 1-20 18H310a20 20 0 0 1-20-18z" fill="none" stroke="#080808" stroke-width="10" stroke-linejoin="round"/>
  <!-- lid -->
  <rect x="252" y="146" width="216" height="32" rx="14" fill="#F7F2E8" stroke="#080808" stroke-width="10"/>
  <!-- ice cubes peeking -->
  <path d="M290 196l22-10 12 18-22 10zM402 192l20 6-6 20-20-6z" fill="#FFF4D1" stroke="#080808" stroke-width="5" stroke-linejoin="round"/>
  <!-- lemon -->
  <circle cx="478" cy="150" r="40" fill="#FFD84D" stroke="#080808" stroke-width="9"/>
  <circle cx="478" cy="150" r="27" fill="#FFF0A8"/>
  <path d="M478 123v54M451 150h54M459 131l38 38M497 131l-38 38" stroke="#FFD84D" stroke-width="5"/>
  <!-- mint -->
  <path d="M232 160c30-30 70-22 70-22s-12 40-52 44c-8 0-14-8-18-22z" fill="#3B8F3A" stroke="#080808" stroke-width="8" stroke-linejoin="round"/>
  <path d="M244 172c18-12 34-20 52-30" stroke="#080808" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
